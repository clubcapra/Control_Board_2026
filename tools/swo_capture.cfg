# =============================================================================
#  swo_capture.cfg - OpenOCD script to capture SWO trace.
# -----------------------------------------------------------------------------
#  Usage (from project root):
#     openocd -f tools/swo_capture.cfg
#
#  Behaviour:
#    - Connects to the ST-Link in HLA SWD mode.
#    - Configures TPIU + ITM port 0 with a 2 Mbit/s SWO baud rate (matches the
#      firmware-side init in lib/SerialSWO/SerialSWO.cpp).
#    - Writes the live raw SWO byte stream to tools/swo.log.  The PlatformIO
#      monitor bridge decodes ITM port 0 and serves clean text on localhost.
#    - Halts the CPU on entry and lets the user attach gdb if desired.  Use
#      `resume` from the OpenOCD telnet console (port 4444) to free run.
# =============================================================================

source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]

# Adapter speed - 1 MHz is rock-solid for ST-Link/V2 clones.
adapter speed 1000

init
reset halt

# ---------------------------------------------------------------------------
#  TPIU configuration: must match the firmware's enableTrace() (2 Mbit/s,
#  72 MHz core clock).  Output is captured in tools/swo.log.
# ---------------------------------------------------------------------------
tpiu config internal tools/swo.log uart off 72000000 2000000
itm port 0 on

# Free-run the firmware.  Comment this out if you prefer to attach gdb first.
resume

echo "=================================================="
echo "  SWO capture is live.  Streaming to tools/swo.log"
echo "  Use the PlatformIO monitor bridge for decoded text."
echo "=================================================="
