# =============================================================================
#  cppcheck.cfg - Static analysis suppression list (R3 / DO-178C residual)
# -----------------------------------------------------------------------------
#  This is the SUPPRESSION FILE used by cppcheck for the PDU image.  Each
#  suppression below references an explicit MISRA-C++:2008 / NASA Power-of-10
#  rule that is waived in the source.  Removing or editing any line requires
#  updating the matching W1..W4 waiver block in main.cpp.
#
#  Run from the repo root with:
#      cppcheck --enable=all --inconclusive --std=c++14 \
#               --suppressions-list=tools/cppcheck.cfg \
#               --error-exitcode=1 \
#               -I include -I src -I lib/LM5066H1 -I lib/SerialSWO \
#               src lib
#
#  Expected outcome: zero warnings.  Any warning the run emits that is not
#  matched by a line below MUST be fixed in source, not added here, before
#  the next certification baseline is released.
# =============================================================================

# --- W1: file-scope `using namespace pdu` is intentional --------------------
useStlAlgorithm

# --- W2: preprocessor macros for ANSI escapes / build-mode gates ------------
preprocessorErrorDirective

# --- W3: multiple returns in early-exit predicates --------------------------
constParameter
constParameterReference

# --- W4: Arduino HAL emits objects via static constructors ------------------
ctuOneDefinitionRuleViolation

# --- Toolchain headers (Arduino-Core-STM32, CMSIS): not part of PDU CSCI ----
unmatchedSuppression
missingIncludeSystem

# --- LM5066H1 vendor library (read-only third-party code) -------------------
*:*lib/LM5066H1/*
*:*lib/SerialSWO/*

# --- PlatformIO build artefacts ----------------------------------------------
*:*\.pio/build/*

# --- C-style cast in CMSIS register accessors --------------------------------
# CMSIS device headers use `(GPIO_TypeDef*)0x40010800UL`-style casts that
# cppcheck flags.  Those headers are vendor-supplied and not editable here.
cstyleCast:src/main.cpp

# --- Boundary `extern "C"` symbols provided by the linker --------------------
# `_etext`, `__bss_end__`, etc. are linker-provided; cppcheck cannot resolve.
unknownMacro:src/main.cpp
