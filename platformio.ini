; =============================================================================
;  Power Distribution Unit (PDU) Firmware - PlatformIO build configuration
; -----------------------------------------------------------------------------
;  Target  : STM32F103C8T6 (Blue Pill)
;  Devices : 3 x LM5066H1 high-voltage hot-swap controllers (48V / 24V / 12V)
;  Style   : Avionics-grade (MISRA-C 2012 + DO-178C inspired defensive code)
;  Author  : ELE791 project
;
;  Single supported flight upload / monitor profile:
;
;    [env:bluepill_flight]
;        - Flash via ST-Link v2 (SWD)
;        - Console (Serial.print) routed to ITM/SWO trace on PB3
;        - Same ST-Link cable carries: programming + console + breakpoints
;        - Requires: ST-Link with the SWO pin physically wired to MCU PB3
; =============================================================================

[platformio]
default_envs = bluepill_flight

; -----------------------------------------------------------------------------
;  Common build options shared across all environments.
; -----------------------------------------------------------------------------
[env]
framework            = arduino
monitor_speed        = 115200
build_unflags        =
build_flags          =
    -Os
    -Wall
    -Wextra
    -Werror=return-type
    -Wpointer-arith
    -Wno-unused-parameter
    -Wno-undef
    -ffunction-sections
    -fdata-sections
    -flto
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -DPDU_FW_VERSION_MAJOR=1
    -DPDU_FW_VERSION_MINOR=0
    -DPDU_FW_VERSION_PATCH=0

; -----------------------------------------------------------------------------
;  Common Blue Pill base (board, clock, sense flags).
; -----------------------------------------------------------------------------
[bluepill_base]
platform             = ststm32
board                = bluepill_f103c8
; Reserve the last 1 KiB flash page (0x0800FC00..0x0800FFFF) for the
; reset-persistent fault FIFO implemented in src/fault_log.cpp.
board_upload.maximum_size = 64512
board_build.f_cpu    = 72000000L
build_flags          =
    ${env.build_flags}
    -DHSE_VALUE=8000000U
    -DPDU_BUILD_TARGET_BLUEPILL=1
    -Wl,--gc-sections

; ===========================================================================
;  FLIGHT env: the only supported build.  PDU_FLIGHT_BUILD enables compile-time
;  checks that reject unsafe bring-up/test configuration.
;
;  Use this environment for qualification, formal verification artefacts,
;  and any flash binary that will leave the lab.
; ===========================================================================
[env:bluepill_flight]
extends              = bluepill_base
upload_protocol      = stlink
debug_tool           = stlink
debug_init_break     = tbreak setup
monitor_port         = socket://127.0.0.1:34430
monitor_filters      = direct
extra_scripts        = tools/pio_swo_monitor.py
build_flags          =
    ${bluepill_base.build_flags}
    -DPDU_USE_SWO=1
    -DPDU_FLIGHT_BUILD=1
    -DSTM32F1_LOCK_DEBUG

; ===========================================================================
;  API DEBUG env: same firmware behavior as flight, but SWO output is limited
;  to RG I2C2 API RX/TX messages.  Use when debugging the external controller
;  without the normal telemetry/config log spam.
; ===========================================================================
[env:bluepill_api_debug]
extends              = bluepill_base
upload_protocol      = stlink
debug_tool           = stlink
debug_init_break     = tbreak setup
monitor_port         = socket://127.0.0.1:34430
extra_scripts        = tools/pio_swo_monitor.py
build_flags          =
    ${bluepill_base.build_flags}
    -DPDU_USE_SWO=1
    -DPDU_FLIGHT_BUILD=1
    -DPDU_API_DEBUG_ONLY=1
    -DSTM32F1_LOCK_DEBUG

; ===========================================================================
;  OUTPUT TEST env: lab-only image that skips hot-swap / RG API logic and
;  cycles only the solenoid lock outputs plus the four PWM LED channels.
; ===========================================================================
[env:bluepill_output_test]
extends              = bluepill_base
upload_protocol      = stlink
debug_tool           = stlink
debug_init_break     = tbreak setup
monitor_port         = socket://127.0.0.1:34430
extra_scripts        = tools/pio_swo_monitor.py
build_flags          =
    ${bluepill_base.build_flags}
    -DPDU_USE_SWO=1
    -DPDU_FLIGHT_BUILD=1
    -DPDU_OUTPUT_TEST_ONLY=1
    -DSTM32F1_LOCK_DEBUG

; ===========================================================================
;  FLIGHT NODEBUG env: standalone deployment image.  Identical functionality
;  to bluepill_flight (rails, I2C2 RG slave, telemetry, fault log, winch...)
;  except that the SWO/ITM trace is NEVER enabled and every Serial.print()
;  call compiles down to a no-op.
;
;  Why this exists:
;    The SWO image is wired to ARM ITM via Cortex-M's ITM_SendChar(), whose
;    inner spin loop is unbounded:
;        while (ITM->PORT[0U].u32 == 0UL) { __NOP(); }
;    With ST-Link draining the SWO pin, the FIFO empties and the loop ends
;    after a few cycles.  With ST-Link unplugged the FIFO fills after the
;    very first burst of console output and ITM_SendChar() spins until the
;    Independent Watchdog fires (~4 s), causing an infinite reset loop and
;    a board that *appears* completely dead on cold power-on.
;
;    This env builds a binary that does not call SerialSWO::enableTrace(),
;    leaves ITM->TCR.ITMENA at its reset default 0, and routes Serial to
;    PduSilentConsole - a stub whose print()/println() are empty templates.
;    There is therefore zero possibility of an SWO-related hang and the
;    board boots and runs without any debugger attached.
;
;  Use this for:
;    - On-rover deployment (no ST-Link plugged into the PDU)
;    - Long-duration unattended runs
;    - Any time you flash with ST-Link then physically unplug it
;
;  Trade-off: NO console output.  The external I2C2 RG API on PB10/PB11
;  remains the only debug/telemetry channel; use RoboGuard's serial monitor
;  to see live state.
; ===========================================================================
[env:bluepill_flight_nodebug]
extends              = bluepill_base
upload_protocol      = stlink
build_flags          =
    ${bluepill_base.build_flags}
    -DPDU_FLIGHT_BUILD=1
    -DSTM32F1_LOCK_DEBUG
